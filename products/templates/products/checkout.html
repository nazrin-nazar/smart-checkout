<!DOCTYPE html>
<html>
<head>
    <title>Smart Checkout - Scan Product</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
        }
        .checkout-card {
            max-width: 480px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            padding: 28px;
        }
        h3.title {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            color: #222;
        }
        #reader {
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
        }
        #scan-status {
            text-align: center;
            font-weight: 600;
            margin: 12px 0;
            color: #888;
            transition: color 0.3s;
        }
        #scan-status.success {
            color: #2e7d32;
        }
        #scan-status.error {
            color: #c62828;
        }
        hr {
            border: none;
            border-top: 1px solid #eee;
            margin: 20px 0;
        }
        h5.cart-title {
            margin-bottom: 10px;
            color: #333;
        }
        #cart-list {
            list-style: none;
            padding: 0;
            margin: 0 0 16px 0;
        }
        .cart-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
            color: #444;
        }
        .cart-item.empty {
            justify-content: center;
            color: #999;
            border-bottom: none;
        }
        .item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .item-name {
            font-weight: 600;
            color: #222;
        }
        .item-price {
            font-size: 0.8rem;
            color: #888;
        }
        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .qty-btn {
            width: 28px;
            height: 28px;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            line-height: 1;
        }
        .qty-btn:hover {
            background: #f0f0f0;
        }
        .qty {
            min-width: 18px;
            text-align: center;
            font-weight: 600;
        }
        .line-total {
            min-width: 64px;
            text-align: right;
            font-weight: 600;
            color: #222;
        }
        .remove-btn {
            border: none;
            background: none;
            color: #c62828;
            font-size: 1rem;
            cursor: pointer;
            padding: 4px;
        }
        .remove-btn:hover {
            background: #fdecea;
            border-radius: 6px;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.25rem;
            font-weight: 700;
            color: #111;
            margin-bottom: 20px;
        }
        #checkout-btn {
            width: 100%;
            padding: 14px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #checkout-btn:hover {
            background-color: #256428;
        }
        #receipt {
            margin-top: 16px;
        }
        .receipt-box {
            background-color: #e8f5e9;
            border: 1px solid #a5d6a7;
            border-radius: 8px;
            padding: 14px;
            text-align: center;
            color: #1b5e20;
        }
    </style>
</head>
<body>

    <div class="checkout-card">
        <h3 class="title">🛒 Smart Checkout</h3>

        <div id="reader"></div>
        <p id="scan-status">Point camera at a QR code</p>

        <hr>

        <h5 class="cart-title">Cart</h5>
        <ul id="cart-list"></ul>

        <div class="total-row">
            <span>Total</span>
            <span>₹<span id="total">0</span></span>
        </div>

        <button id="checkout-btn">Complete Checkout</button>
        <div id="receipt"></div>
    </div>

    <script>
        // cart format: { productId: { name, price, qty, stock } }
        let cart = {};
        let isProcessing = false;
        let statusTimer = null;

        const statusMsg = document.getElementById('scan-status');

        function showStatus(message, type, delay) {
            clearTimeout(statusTimer);
            statusMsg.textContent = message;
            statusMsg.classList.remove('success', 'error');
            if (type) statusMsg.classList.add(type);
            statusTimer = setTimeout(() => {
                statusMsg.textContent = 'Ready to scan next item...';
                statusMsg.classList.remove('success', 'error');
            }, delay);
        }

        function renderCart() {
            const list = document.getElementById('cart-list');
            list.innerHTML = '';
            let total = 0;

            const ids = Object.keys(cart);

            if (ids.length === 0) {
                const empty = document.createElement('li');
                empty.className = 'cart-item empty';
                empty.textContent = 'Cart is empty';
                list.appendChild(empty);
            }

            ids.forEach(id => {
                const item = cart[id];
                const lineTotal = item.price * item.qty;
                total += lineTotal;

                const li = document.createElement('li');
                li.className = 'cart-item';

                const info = document.createElement('div');
                info.className = 'item-info';
                const nameEl = document.createElement('span');
                nameEl.className = 'item-name';
                nameEl.textContent = item.name;
                const priceEl = document.createElement('span');
                priceEl.className = 'item-price';
                priceEl.textContent = `₹${item.price.toFixed(2)} each`;
                info.appendChild(nameEl);
                info.appendChild(priceEl);

                const controls = document.createElement('div');
                controls.className = 'qty-controls';
                controls.innerHTML =
                    `<button class="qty-btn" data-action="dec" data-id="${id}">−</button>
                     <span class="qty">${item.qty}</span>
                     <button class="qty-btn" data-action="inc" data-id="${id}">+</button>`;

                const lineEl = document.createElement('div');
                lineEl.className = 'line-total';
                lineEl.textContent = `₹${lineTotal.toFixed(2)}`;

                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.dataset.action = 'remove';
                removeBtn.dataset.id = id;
                removeBtn.textContent = '✕';

                li.appendChild(info);
                li.appendChild(controls);
                li.appendChild(lineEl);
                li.appendChild(removeBtn);
                list.appendChild(li);
            });

            document.getElementById('total').textContent = total.toFixed(2);
        }

        document.getElementById('cart-list').addEventListener('click', function (e) {
            const btn = e.target.closest('button');
            if (!btn) return;

            const id = btn.dataset.id;
            const item = cart[id];
            if (!item) return;

            if (btn.dataset.action === 'inc') {
                if (item.qty < item.stock) {
                    item.qty += 1;
                } else {
                    showStatus(`⚠️ Only ${item.stock} of ${item.name} available`, 'error', 3000);
                }
            } else if (btn.dataset.action === 'dec') {
                item.qty -= 1;
                if (item.qty <= 0) delete cart[id];
            } else if (btn.dataset.action === 'remove') {
                delete cart[id];
            }

            renderCart();
        });

        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;
            isProcessing = true;

            function unlock(delay) {
                setTimeout(() => { isProcessing = false; }, delay);
            }

            fetch(`/api/product/${decodedText}/`)
                .then(response => response.json())
                .then(data => {
                    const existingQty = cart[data.id] ? cart[data.id].qty : 0;

                    if (data.stock <= 0) {
                        showStatus(`❌ ${data.name} is out of stock`, 'error', 3000);
                        unlock(3000);
                        return;
                    }
                    if (existingQty >= data.stock) {
                        showStatus(`⚠️ Only ${data.stock} of ${data.name} available`, 'error', 3000);
                        unlock(3000);
                        return;
                    }

                    if (cart[data.id]) {
                        cart[data.id].qty += 1;
                        cart[data.id].stock = data.stock;
                    } else {
                        cart[data.id] = {
                            name: data.name,
                            price: parseFloat(data.price),
                            qty: 1,
                            stock: data.stock
                        };
                    }

                    document.getElementById('receipt').innerHTML = '';
                    renderCart();
                    showStatus(`✅ Added: ${data.name}`, 'success', 4000);
                    unlock(4000);
                })
                .catch(error => {
                    console.error('Product not found', error);
                    isProcessing = false;
                });
        }

        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: 250 }
        );
        html5QrcodeScanner.render(onScanSuccess);

        document.getElementById('checkout-btn').addEventListener('click', function () {
            const ids = Object.keys(cart);
            if (ids.length === 0) {
                alert('Cart is empty!');
                return;
            }

            // Repeat each product id as many times as its quantity
            const productIds = [];
            ids.forEach(id => {
                for (let i = 0; i < cart[id].qty; i++) {
                    productIds.push(parseInt(id));
                }
            });

            fetch('/api/complete_order/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ product_ids: productIds })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                    return;
                }

                                document.getElementById('receipt').innerHTML =
                    `<div class="receipt-box">
                        <strong>Order #${data.order_id} Complete!</strong><br>
                        Total Paid: ₹${data.total}<br>
                        <a href="/receipt/${data.order_id}/" target="_blank"
                           style="display:inline-block;margin-top:10px;color:#1b5e20;font-weight:600;">
                           🧾 View / Print Receipt
                        </a>
                    </div>`;

                cart = {};
                renderCart();
            })
            .catch(error => {
                console.error('Checkout failed', error);
            });
        });

        renderCart();
    </script>
</body>
</html>
