<!DOCTYPE html>
<html>
<head>
    <title>Smart Checkout - Scan Product</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
    <h1>Scan Product QR Code</h1>

   <div id="reader" style="width: 400px;"></div>
<p id="scan-status" style="font-weight: bold; color: gray;">Point camera at a QR code</p>
    <h2>Cart</h2>
    <ul id="cart-list"></ul>
    <h3>Total: ₹<span id="total">0</span></h3>

    <button id="checkout-btn">Complete Checkout</button>
    <div id="receipt"></div>

   <script>
    let total = 0;
    let cartProductIds = [];
    let isProcessing = false;

    function onScanSuccess(decodedText, decodedResult) {
        if (isProcessing) return;
        isProcessing = true;

        fetch(`/api/product/${decodedText}/`)
            .then(response => response.json())
            .then(data => {
                const cartList = document.getElementById('cart-list');
                const li = document.createElement('li');
                li.textContent = `${data.name} - ₹${data.price}`;
                cartList.appendChild(li);

                total += parseFloat(data.price);
                document.getElementById('total').textContent = total.toFixed(2);

                cartProductIds.push(data.id);

                // Show a clear message so it's obvious the scan worked
                const statusMsg = document.getElementById('scan-status');
                statusMsg.textContent = `✅ Added: ${data.name}`;
                statusMsg.style.color = 'green';

                // Give a longer pause (4 seconds) before allowing next scan
                setTimeout(() => {
                    isProcessing = false;
                    statusMsg.textContent = 'Ready to scan next item...';
                    statusMsg.style.color = 'gray';
                }, 4000);
            })
            .catch(error => {
                console.error('Product not found', error);
                isProcessing = false;
            });
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", { fps: 10, qrbox: 250 }
    );
    html5QrcodeScanner.render(onScanSuccess);

    document.getElementById('checkout-btn').addEventListener('click', function () {
        if (cartProductIds.length === 0) {
            alert('Cart is empty!');
            return;
        }

        fetch('/api/complete_order/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ product_ids: cartProductIds })
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('receipt').innerHTML =
                `<h3>Order #${data.order_id} Complete!</h3><p>Total Paid: ₹${data.total}</p>`;

            cartProductIds = [];
            total = 0;
            document.getElementById('cart-list').innerHTML = '';
            document.getElementById('total').textContent = '0';
        })
        .catch(error => {
            console.error('Checkout failed', error);
        });
    });
</script>

</body>
</html>
